name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: contractfit_test
          POSTGRES_USER: contractfit
          POSTGRES_PASSWORD: contractfit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contractfit -d contractfit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - name: Verify PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://contractfit:contractfit@localhost:5432/contractfit_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
