name: contractfit

services:
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://contractfit:contractfit@postgres:5432/contractfit}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-development-only-change-me-32-bytes}
      AUTH_ACCESS_TOKEN_MINUTES: ${AUTH_ACCESS_TOKEN_MINUTES:-60}
      AI_PROVIDER: ${AI_PROVIDER:-offline}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-disabled}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBEDDING_MATCH_LIMIT: ${EMBEDDING_MATCH_LIMIT:-100}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-postgres}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-/app/data/uploads}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-20971520}
      PROCESSING_MODE: ${PROCESSING_MODE:-redis}
      PROCESSING_QUEUE_NAME: ${PROCESSING_QUEUE_NAME:-contractfit:document-jobs}
      OCR_BACKEND: ${OCR_BACKEND:-tesseract}
      TESSERACT_COMMAND: ${TESSERACT_COMMAND:-tesseract}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "contractfit.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://contractfit:contractfit@postgres:5432/contractfit}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_BACKEND: postgres
      UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-/app/data/uploads}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-20971520}
      PROCESSING_MODE: redis
      PROCESSING_QUEUE_NAME: ${PROCESSING_QUEUE_NAME:-contractfit:document-jobs}
      OCR_BACKEND: ${OCR_BACKEND:-tesseract}
      TESSERACT_COMMAND: ${TESSERACT_COMMAND:-tesseract}
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sam-ingester:
    profiles: ["sam"]
    build:
      context: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m contractfit.sam_worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://contractfit:contractfit@postgres:5432/contractfit}
      STORAGE_BACKEND: postgres
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SAM_API_KEY: ${SAM_API_KEY:-}
      SAM_SYNC_ENABLED: ${SAM_SYNC_ENABLED:-false}
      SAM_SYNC_INTERVAL_MINUTES: ${SAM_SYNC_INTERVAL_MINUTES:-360}
      SAM_LOOKBACK_DAYS: ${SAM_LOOKBACK_DAYS:-7}
      SAM_PAGE_SIZE: ${SAM_PAGE_SIZE:-100}
      SAM_REQUEST_TIMEOUT_SECONDS: ${SAM_REQUEST_TIMEOUT_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contractfit}
      POSTGRES_USER: ${POSTGRES_USER:-contractfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contractfit}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contractfit} -d ${POSTGRES_DB:-contractfit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  uploads_data:
