<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ContractFit</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#08111f;color:#e8eef8}body{margin:0;background:radial-gradient(circle at top right,#15395a,#08111f 45%);min-height:100vh}main{max-width:1120px;margin:auto;padding:48px 24px}header{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:32px}h1{font-size:clamp(2.4rem,7vw,5rem);line-height:.9;margin:0;letter-spacing:-.06em}.eyebrow{color:#5eead4;text-transform:uppercase;letter-spacing:.16em;font-size:.75rem}.subtle{color:#91a4bd;max-width:620px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#101f33e0;border:1px solid #27435f;border-radius:18px;padding:22px;box-shadow:0 20px 50px #0005}.score{font-size:3rem;font-weight:800;color:#5eead4}.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#173f47;color:#88f7e5;font-size:.75rem}.gate{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #27435f;padding:10px 0}button{background:#5eead4;color:#06211e;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
</style></head><body><main>
<header><div><div class="eyebrow">Evidence-grounded bid intelligence</div><h1>ContractFit</h1><p class="subtle">Rank government opportunities against real contractor constraints, with every decision linked to source evidence.</p></div><button onclick="resetDemo()">Reset demo</button></header>
<section class="grid" id="summary"></section><h2>Ranked opportunities</h2><section class="grid" id="matches"></section>
</main><script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){const[p,o,m,e]=await Promise.all([fetch('/api/profile').then(r=>r.json()),fetch('/api/opportunities').then(r=>r.json()),fetch('/api/matches').then(r=>r.json()),fetch('/api/evaluation').then(r=>r.json())]);document.querySelector('#summary').innerHTML=`<article class="card"><div class="eyebrow">Contractor</div><h3>${esc(p.name)}</h3><p>${esc(p.capability_statement)}</p></article><article class="card"><div class="eyebrow">Pipeline</div><div class="score">${o.length}</div><p>opportunities evaluated</p></article><article class="card"><div class="eyebrow">Evaluation</div><div class="score">${Math.round(e.eligibility_accuracy*100)}%</div><p>eligibility accuracy · ${Math.round(e.citation_validity*100)}% valid citations</p></article>`;const byId=Object.fromEntries(o.map(x=>[x.id,x]));document.querySelector('#matches').innerHTML=m.sort((a,b)=>b.fit_score-a.fit_score).map(x=>{const y=byId[x.opportunity_id];return`<article class="card"><span class="badge">${esc(x.eligibility)}</span><div class="score">${x.fit_score}</div><h3>${esc(y.title)}</h3><p>${esc(x.explanation)}</p>${x.gates.map(g=>`<div class="gate"><span>${esc(g.name)}</span><strong>${esc(g.status)}</strong></div>`).join('')}<p class="subtle">Scoring: ${esc(x.scoring_method)}</p></article>`}).join('')}
async function resetDemo(){await fetch('/api/demo/reset',{method:'POST'});await load()}load();
</script></body></html>
